<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Assistant d’audience – Maquette interactive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F3F7;--surface:#fff;--surface2:#F7F8FB;--ink:#141A2E;--muted:#596079;--line:#E0E3EC;--line2:#C9CEDB;
--indigo:#1D2A6B;--indigo2:#33449C;--isoft:#EAEDF8;--iink:#1D2A6B;--brass:#94640F;--bsoft:#F6EDDB;
--ok:#1B6B48;--oksoft:#E2F1E9;--warn:#855600;--warnsoft:#FBEFD6;--bad:#A3291F;--badsoft:#FBE6E3;--info:#22579A;--infosoft:#E5EEF9;
--btn:#1D2A6B;--btnfg:#fff;--head:#121A47;
--serif:"Newsreader",Georgia,"Times New Roman",serif;--sans:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--ease:cubic-bezier(.2,.8,.2,1);
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1020;--surface:#141A2F;--surface2:#192038;--ink:#E8EBF4;--muted:#A3AAC0;--line:#252D48;--line2:#343D5E;
--indigo:#9DADF6;--indigo2:#B7C3FA;--isoft:#1E2750;--iink:#CBD3FB;--brass:#E2B65E;--bsoft:#382B12;
--ok:#7FD4A8;--oksoft:#12342A;--warn:#F0C66A;--warnsoft:#382A0C;--bad:#FF9C93;--badsoft:#3E1A18;--info:#8DB8F2;--infosoft:#152946;
--btn:#9DADF6;--btnfg:#0C1020;--head:#090D1D;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0C1020;--surface:#141A2F;--surface2:#192038;--ink:#E8EBF4;--muted:#A3AAC0;--line:#252D48;--line2:#343D5E;
--indigo:#9DADF6;--indigo2:#B7C3FA;--isoft:#1E2750;--iink:#CBD3FB;--brass:#E2B65E;--bsoft:#382B12;
--ok:#7FD4A8;--oksoft:#12342A;--warn:#F0C66A;--warnsoft:#382A0C;--bad:#FF9C93;--badsoft:#3E1A18;--info:#8DB8F2;--infosoft:#152946;
--btn:#9DADF6;--btnfg:#0C1020;--head:#090D1D;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(80px + env(safe-area-inset-top,0px));scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:45;background:var(--surface)}
body.app::before{background:var(--head)}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;line-height:1.15;margin:0 0 .4em;color:var(--ink)}
h1{font-size:clamp(1.7rem,3vw,2.25rem)}h2{font-size:clamp(1.25rem,2vw,1.5rem)}h3{font-size:1.15rem}
h4{font:600 1rem/1.3 var(--sans);margin:0 0 .25em}
p{margin:0 0 .8em}a{color:var(--info)}button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--indigo2);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}
.muted{color:var(--muted)}.small{font-size:.875rem}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.grow{flex:1;min-width:0}
.proto{background:var(--bsoft);color:var(--brass);font-size:.8rem;text-align:center;padding:6px 12px}
/* boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--btn);color:var(--btnfg);border:1.5px solid var(--btn);padding:10px 18px;border-radius:10px;font-weight:600;min-height:44px;text-decoration:none;transition:transform .15s var(--ease),box-shadow .2s,background-color .2s}
.btn:hover{box-shadow:0 8px 20px -10px var(--btn)}.btn:active{transform:scale(.98)}
.btn.sec{background:var(--surface);color:var(--ink);border-color:var(--line2)}.btn.sec:hover{background:var(--surface2);box-shadow:none}
.btn.ghost{background:transparent;border-color:transparent;color:var(--info);padding:6px 8px;min-height:40px}.btn.ghost:hover{box-shadow:none;text-decoration:underline}
.btn.lt{background:#fff;color:#121A47;border-color:#fff}.btn.ol{background:transparent;color:#fff;border-color:rgba(255,255,255,.45)}.btn.ol:hover{background:rgba(255,255,255,.08)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:.9rem;border-radius:8px}
.btn.dng{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.okb{background:var(--ok);border-color:var(--ok);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.dng,:root:not([data-theme="light"]) .btn.okb{color:#0C1020}}
:root[data-theme="dark"] .btn.dng,:root[data-theme="dark"] .btn.okb{color:#0C1020}
.btn[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none;transform:none}
.btn.wide{width:100%}
/* en-tête public */
.pub-h{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.pub-h .wrap{display:flex;align-items:center;gap:20px;min-height:68px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left;color:inherit}
.brand b{display:block;font:600 1.06rem/1.1 var(--serif)}.brand small{display:block;color:var(--muted);font-size:.76rem}
.pnav{display:flex;gap:2px;margin-left:auto}.pnav button{background:none;border:0;padding:8px 12px;border-radius:8px;color:var(--muted);font-weight:500}.pnav button:hover{color:var(--ink);background:var(--surface2)}
.pact{display:flex;gap:8px}
.burger{display:none;background:none;border:1px solid var(--line);border-radius:10px;min-height:44px;min-width:44px;align-items:center;justify-content:center}
.mnav{display:none}
/* héro */
.hero{position:relative;overflow:hidden;background:#121A47;color:#fff;padding:76px 0 88px}
.hero::before{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at 88% 22%,rgba(255,255,255,.055) 0 1px,transparent 1px 15px);pointer-events:none}
.hero::after{content:"";position:absolute;inset:auto 0 0;height:4px;background:linear-gradient(90deg,#B98A2E,#E2C27A 50%,#B98A2E)}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center}
.hero h1{color:#fff;font-size:clamp(2.05rem,4.4vw,3.2rem);line-height:1.08;max-width:15ch}
.hero .lead{color:#C9D0EE;font-size:1.1rem;max-width:50ch}
.demo-card{background:var(--surface);color:var(--ink);border-radius:20px;padding:22px;box-shadow:0 34px 70px -24px rgba(0,0,0,.6)}
.herotrk{min-height:252px}
.a1,.a2,.a3,.a4{animation:rise .8s var(--ease) both}.a2{animation-delay:.08s}.a3{animation-delay:.16s}.a4{animation-delay:.26s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.hint{display:flex;gap:10px;align-items:flex-start;font-size:.88rem;color:var(--muted);border-top:1px solid var(--line);margin-top:16px;padding-top:14px}.hint svg{color:var(--iink)}
.band{padding:76px 0}.band.alt{background:var(--surface);border-block:1px solid var(--line)}
.band .lead{color:var(--muted);max-width:62ch;font-size:1.05rem}
.grid{display:grid;gap:18px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px}
.space{display:flex;flex-direction:column;gap:12px}.space .ico{width:50px;height:50px;border-radius:14px;background:var(--isoft);color:var(--iink);display:grid;place-items:center}
.space ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}.space li{display:flex;gap:10px;color:var(--muted);font-size:.95rem}.space li svg{color:var(--ok);margin-top:3px}
.space .btn{margin-top:auto;align-self:flex-start}
.ways{display:flex;flex-direction:column;gap:22px}.way{display:flex;gap:16px}.way .ico{width:44px;height:44px;border-radius:12px;background:var(--bsoft);color:var(--brass);display:grid;place-items:center;flex:none}.way p{margin:2px 0 0;color:var(--muted)}
.steps{counter-reset:s;display:grid;grid-template-columns:repeat(4,1fr);gap:22px;list-style:none;padding:0;margin:28px 0}
.steps li{counter-increment:s;position:relative;padding-top:52px}
.steps li::before{content:counter(s);position:absolute;top:0;left:0;width:38px;height:38px;border-radius:50%;background:var(--btn);color:var(--btnfg);display:grid;place-items:center;font:600 1.1rem var(--serif)}
.steps li::after{content:"";position:absolute;top:18px;left:50px;right:-12px;height:2px;background:var(--line)}.steps li:last-child::after{display:none}
.steps p{color:var(--muted)}
.callout{display:flex;gap:14px;background:var(--isoft);border-left:4px solid var(--indigo2);border-radius:10px;padding:16px 18px;color:var(--ink)}.callout>svg{color:var(--iink);margin-top:2px}
.callout.warnc{background:var(--warnsoft);border-color:var(--warn)}.callout.warnc>svg{color:var(--warn)}
.callout.okc{background:var(--oksoft);border-color:var(--ok)}.callout.okc>svg{color:var(--ok)}
details.faq{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 18px}details.faq summary{padding:15px 0;cursor:pointer;font-weight:600}details.faq p{color:var(--muted)}
footer.pf{background:var(--head);color:#C1C8E6;padding:36px 0 96px;font-size:.9rem}
/* téléphone USSD */
.phone{width:270px;margin:0 auto;border-radius:38px;background:#0E1330;padding:16px 14px 20px;box-shadow:0 30px 60px -24px rgba(9,13,32,.55),inset 0 0 0 2px #2A3263}
.phone .top{width:70px;height:6px;border-radius:3px;background:#2A3263;margin:0 auto 14px}
.phone .scr{background:#D9E3CF;color:#141A10;border-radius:18px;min-height:280px;padding:16px;display:flex;flex-direction:column}
.phone pre{margin:0;white-space:pre-wrap;font:500 .95rem/1.45 var(--sans);flex:1}
.phone .in{display:flex;gap:6px;margin-top:12px}.phone input{flex:1;min-width:0;border:1px solid #9AA88F;border-radius:8px;padding:8px;background:#EEF3E8;color:#141A10;font:inherit}
.phone button{border:0;border-radius:8px;background:#1D2A6B;color:#fff;padding:8px 12px;font-weight:600}
.phone .cap{text-align:center;color:#8F98C4;font-size:.78rem;margin-top:12px}
/* formulaires */
label.f{display:block;font-weight:600;margin-bottom:16px}label.f span.h{display:block;font-weight:400;color:var(--muted);font-size:.86rem;margin-top:2px}
input[type=text],input:not([type]),input[type=email],input[type=password],input[type=tel],select,textarea{width:100%;font:inherit;padding:10px 12px;border:1.5px solid var(--line2);border-radius:10px;background:var(--surface);color:var(--ink);margin-top:6px;min-height:46px;transition:border-color .15s,box-shadow .15s}
textarea{min-height:110px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--indigo2);box-shadow:0 0 0 4px var(--isoft)}
.chk{display:flex!important;gap:10px;align-items:flex-start;font-weight:500!important}.chk input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--indigo)}
.err{color:var(--bad);font-size:.92rem;margin:8px 0;display:flex;gap:8px;align-items:flex-start}
.otp{font:600 1.7rem/1 var(--serif)!important;letter-spacing:.45em;text-align:center}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0 22px;padding:4px;background:var(--surface2);border:1px solid var(--line);border-radius:12px}
.seg3 button{border:0;background:transparent;border-radius:9px;padding:10px 6px;font-weight:600;color:var(--muted);transition:background .2s,color .2s}
.seg3 button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(20,26,46,.15)}
.authbox{max-width:480px;margin:52px auto 110px;padding:0 16px}.authbox .card{padding:30px}
.secure{display:flex;gap:10px;font-size:.85rem;color:var(--muted);background:var(--surface2);border-radius:10px;padding:12px;margin-top:18px}
.verified{display:flex;gap:12px;align-items:center;background:var(--oksoft);color:var(--ok);border-radius:12px;padding:14px 16px;animation:pop .35s var(--ease)}
.checking{text-align:center;padding:18px 0 8px}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--isoft);border-top-color:var(--indigo2);animation:sp .9s linear infinite;margin:10px auto 16px}@keyframes sp{to{transform:rotate(360deg)}}
/* coquille applicative */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--head);color:#fff}
.appbar .in{display:flex;align-items:center;gap:12px;padding:10px 20px;min-height:62px}
.appbar .brand small{color:#AEB7DE}
.ab{background:rgba(255,255,255,.08);border:0;color:#fff!important;border-radius:10px;min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 12px;position:relative;transition:background .15s}
.ab:hover{background:rgba(255,255,255,.16)}
.cnt{position:absolute;top:3px;right:3px;background:#E5484D;color:#fff;font-size:.7rem;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.pill{background:rgba(255,255,255,.12);padding:4px 12px;border-radius:99px;font-size:.82rem}
.layout{display:grid;grid-template-columns:268px minmax(0,1fr);max-width:1440px;margin:0 auto}
.side{padding:16px 12px 90px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:2px;position:sticky;top:calc(62px + env(safe-area-inset-top,0px));height:calc(100vh - 62px - env(safe-area-inset-top,0px));overflow:auto}
.who{padding:8px 12px 16px;border-bottom:1px solid var(--line);margin-bottom:10px}.who b{display:block;font-family:var(--serif);font-size:1.08rem}
.vf{display:inline-flex;gap:5px;align-items:center;color:var(--ok);font-size:.8rem;font-weight:600;margin-top:4px}
.nv{position:relative;display:flex;align-items:center;gap:12px;background:none;border:0;padding:10px 12px;border-radius:10px;text-align:left;width:100%;min-height:44px;color:var(--muted);font-weight:500;transition:background .15s,color .15s}
.nv:hover{background:var(--surface2);color:var(--ink)}
.nv[aria-current=page]{background:var(--isoft);color:var(--iink);font-weight:600}
.nv[aria-current=page]::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--brass)}
.nv .cnt{position:static;margin-left:auto}
main#main{padding:30px 32px 130px;min-width:0;min-height:calc(100vh - 100px)}
.enter{animation:viewin .4s var(--ease) both}@keyframes viewin{from{opacity:0;transform:translateY(8px)}}
.ph{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:24px}.ph h1{margin:0}.ph p{margin:6px 0 0;color:var(--muted);max-width:70ch}
.crumb{font-size:.9rem;color:var(--muted);margin-bottom:10px}.crumb button{background:none;border:0;color:var(--info);padding:0}.crumb button:hover{text-decoration:underline}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:24px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;text-align:left;display:block;width:100%;transition:border-color .15s,transform .15s var(--ease)}
button.stat:hover{border-color:var(--indigo2);transform:translateY(-1px)}
.stat b{display:block;font:600 2rem/1.05 var(--serif);color:var(--ink)}.stat span{color:var(--muted);font-size:.9rem}
.qa{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:24px}
.qa button{display:flex;flex-direction:column;align-items:flex-start;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;text-align:left;font-weight:600;transition:border-color .15s,transform .15s var(--ease)}
.qa button:hover{border-color:var(--indigo2);transform:translateY(-2px)}
.qa .ico{width:42px;height:42px;border-radius:12px;background:var(--isoft);color:var(--iink);display:grid;place-items:center}
.next{position:relative;overflow:hidden;display:flex;gap:22px;align-items:center;flex-wrap:wrap;background:var(--head);color:#fff;border-radius:18px;padding:22px 26px;margin-bottom:24px}
.next::before{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at 100% 0,rgba(255,255,255,.06) 0 1px,transparent 1px 13px);pointer-events:none}
.next>*{position:relative}.next .days{text-align:center;min-width:76px;padding-right:22px;border-right:1px solid rgba(255,255,255,.18)}
.next .days b{display:block;font:600 2.8rem/1 var(--serif);color:#E2C27A}.next .days span{font-size:.85rem;color:#B9C1E6}
.next h2{color:#fff;margin:2px 0 4px}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:22px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:22px;overflow:hidden}
.panel>header{display:flex;align-items:center;gap:12px;padding:15px 20px;border-bottom:1px solid var(--line)}.panel>header h2,.panel>header h3{margin:0;font-size:1.12rem}
.panel .body{padding:20px}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:.84rem;color:var(--muted);font-weight:600;padding:10px 16px;background:var(--surface2);border-bottom:1px solid var(--line)}
td{padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:top}tr:last-child td{border-bottom:0}tbody tr{transition:background .12s}tbody tr:hover{background:var(--surface2)}
td .ref{font-weight:700}
.seg{display:flex;gap:3px;margin-top:6px}.seg i{width:22px;height:5px;border-radius:3px;background:var(--line)}.seg i.on{background:var(--indigo2)}
.bd{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px;font-size:.8rem;font-weight:600;white-space:nowrap}
.bd.grey{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}.bd.blue{background:var(--infosoft);color:var(--info)}.bd.sky{background:var(--isoft);color:var(--iink)}
.bd.amber{background:var(--warnsoft);color:var(--warn)}.bd.green{background:var(--oksoft);color:var(--ok)}.bd.orange{background:var(--bsoft);color:var(--brass)}.bd.red{background:var(--badsoft);color:var(--bad)}
.toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}.toolbar input{margin:0;max-width:380px}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-bottom:16px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;color:var(--muted);white-space:nowrap;font-weight:600;transition:color .15s,border-color .2s}.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--brass)}
.empty{display:flex;gap:12px;align-items:center;padding:18px 20px;border:1.5px dashed var(--line2);border-radius:14px;color:var(--muted);margin-bottom:22px}
/* notifications */
.nl{list-style:none;margin:0;padding:0}.nl>li{border-bottom:1px solid var(--line)}.nl>li:last-child{border:0}
.nrow{display:flex;align-items:center;gap:10px;padding-right:16px}.nrow:hover{background:var(--surface2)}
.nmain{display:flex;gap:14px;flex:1;min-width:0;text-align:left;background:none;border:0;padding:14px 4px 14px 20px}
.ni{width:40px;height:40px;border-radius:12px;background:var(--isoft);color:var(--iink);display:grid;place-items:center;flex:none}
.un .ni{background:var(--btn);color:var(--btnfg)}.dotu{width:9px;height:9px;border-radius:50%;background:#E5484D;margin-top:8px;flex:none}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.chs{display:inline-flex;gap:6px;flex-wrap:wrap}.chs span{display:inline-flex;gap:4px;align-items:center;font-size:.74rem;color:var(--muted);background:var(--surface2);border:1px solid var(--line);border-radius:99px;padding:1px 8px}
.ev{padding:12px 20px}
/* chronologie */
.tl{list-style:none;margin:0;padding:0}.tl li{position:relative;display:flex;gap:16px;padding-bottom:26px}
.tl li::before{content:"";position:absolute;left:17px;top:38px;bottom:0;width:2px;background:var(--line)}.tl li:last-child{padding-bottom:0}.tl li:last-child::before{display:none}
.tl li.done::before{background:var(--indigo2)}

.paper .sig{margin-top:30px;padding-top:16px;border-top:1px solid var(--line);font:500 .9rem var(--sans);color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:14px}.bar{display:grid;grid-template-columns:150px 1fr 36px;gap:12px;align-items:center;font-size:.92rem}
.bar .t{height:14px;border-radius:7px;background:var(--surface2);overflow:hidden}.bar .t i{display:block;height:100%;background:var(--indigo2);border-radius:7px;animation:grow .9s var(--ease) both;transform-origin:left}

.diff{font:400 1rem/1.7 var(--serif)}.diff del{background:var(--badsoft);color:var(--bad)}.diff ins{background:var(--oksoft);color:var(--ok);text-decoration:none}
.gcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.gcard{display:flex;gap:14px}.gcard .ico{width:44px;height:44px;border-radius:12px;background:var(--isoft);color:var(--iink);display:grid;place-items:center;flex:none}.gcard p{margin:4px 0 0;color:var(--muted)}
.phase{position:relative}.phase .num{font:600 3rem/1 var(--serif);color:var(--brass);opacity:.9}
.overlay{position:absolute;inset:0;background:var(--surface);display:grid;place-items:center;text-align:center;z-index:2;animation:fade .2s}
.rel{position:relative}

/* ===== Moteur d’écoute (simulation) ===== */
const SCR=k=>k==='dict'?SCRIPT_M:SCRIPT_A;
function liveInit(affId,kind){S.L={aff:affId,kind,run:false,si:0,gap:0,ms:0,shown:[],done:false,busy:false}}
function goStop(){const L=S.L;if(!L)return;const a=aff(L.aff);if(a.huis){toast('Écoute impossible : affaire en huis clos.','w');return}if(L.done&&!L.run){toast('L’extrait de démonstration est terminé. Utilisez « Terminer et structurer ».','w');return}
 L.run=!L.run;log(L.run?'Go':'Stop',a.rg);if(L.run&&a.st==='attente')a.st='encours';render()}
function tick(){const L=S.L;if(!L||!L.run)return;const sc=SCR(L.kind);L.ms+=100;
 if(L.gap>0){L.gap--;paint();return}
 const cur=L.shown[L.shown.length-1];
 if(!cur||cur.full){if(L.si>=sc.length){L.run=false;L.done=true;log('Stop (fin de l’extrait)',aff(L.aff).rg);render();return}const src=sc[L.si++];L.shown.push(Object.assign({},src,{n:0,full:false,conf:null}))}
 else{cur.n+=1;if(cur.n>=cur.t.split(' ').length){cur.full=true;L.gap=7}}
 paint()}
setInterval(tick,100);
function activeZone(){const L=S.L;if(!L||!L.run)return null;const c=[...L.shown].reverse().find(x=>!x.only);return c?SPK[c.conf||c.s].z:null}
function hiU(t,u){let h=esc(t);(u||[]).forEach(p=>{h=h.replace(esc(p),`<mark class="u" title="Passage incertain : à vérifier à la relecture">${esc(p)}</mark>`)});return h}
function txHTML(){const L=S.L;if(!L.shown.length)return `<div class="empty" style="margin:0">${ic('mic',22)}<span>${L.kind==='dict'?'Appuyez sur Go puis dictez. Le texte s’affiche au fur et à mesure.':'Appuyez sur Go à l’appel de la cause. Le texte des débats s’affiche au fur et à mesure.'}</span></div>`;
 return L.shown.map((g,i)=>{let h=g.m?`<div class="mk">${ic('flag',14)}${g.m}</div>`:'';if(g.only)return h;
  const q=L.kind!=='dict'&&g.sc&&g.sc<.7&&!g.conf,sp=SPK[g.conf||g.s];
  h+=`<div class="sg"><div class="spk ${q?'q':''}">${q?'Intervenant à confirmer<small>suggestion : '+sp.n.toLowerCase()+'</small>':sp.n+`<small>${sp.w}${g.conf?' (confirmé)':''}</small>`}</div><div class="grow"><p>${g.full?hiU(g.t,g.u):esc(g.t.split(' ').slice(0,g.n).join(' '))+'<span class="caret"></span>'}</p>
  ${q&&g.full?`<div class="spkq">${ic('users',16)}Qui parle ? ${SPK_ORDER.map((k,j)=>`<button onclick="confirmSpk(${i},'${k}')">${j+1}. ${SPK[k].n}</button>`).join('')}</div>`:''}</div></div>`;return h}).join('')+(L.done?`<div class="callout okc" style="margin-top:16px">${ic('check',22)}<div><b>Fin de l’extrait de démonstration.</b><br>Utilisez « Terminer et structurer » pour produire le projet de document.</div></div>`:'')}
function paint(){const L=S.L,e=document.getElementById('tx');if(!e||!L)return;const atBottom=e.scrollHeight-e.scrollTop-e.clientHeight<60;e.innerHTML=txHTML();if(atBottom)e.scrollTop=e.scrollHeight;
 const t=document.getElementById('timer');if(t)t.textContent=fmtT(L.ms);const z=activeZone();document.querySelectorAll('.z').forEach(g=>g.classList.toggle('on',g.dataset.z===z))}
function confirmSpk(i,k){const g=S.L.shown[i];g.conf=k;g.sc=1;log('Intervenant confirmé : '+SPK[k].n,aff(S.L.aff).rg);paint()}
function addMark(m){if(!S.L)return;S.L.shown.push({m,only:true,full:true});log('Repère : '+m,aff(S.L.aff).rg);paint()}
function huisModal(){openModal(`<h2>${ic('lock',24)}Passer en huis clos</h2><p>L’écoute s’arrête immédiatement et <b>tout ce qui a été capté pour cette affaire est effacé</b> : audio et texte. Le journal garde la trace de l’effacement, sans son contenu.</p><div class="mrow"><button class="btn sec" onclick="closeModal()">Annuler</button><button class="btn dng" onclick="huisOk()">${ic('trash',18)}Couper et effacer</button></div>`)}
function huisOk(){const a=aff(S.L.aff);a.huis=true;a.st='huis';log('Huis clos prononcé : écoute coupée, captation effacée',a.rg);S.L=null;closeModal();toast('Huis clos : écoute coupée et captation effacée.','ok');render()}
function finish(){const L=S.L;if(!L.shown.filter(x=>!x.only).length){toast('Lancez l’écoute avec Go avant de terminer.','w');return}
 const q=L.shown.filter(g=>!g.only&&g.full&&g.sc&&g.sc<.7&&!g.conf).length;if(q){openModal(`<h2>${ic('users',24)}${q} intervenant${q>1?'s':''} à confirmer</h2><p>Indiquez qui a parlé avant de terminer : un propos ne doit jamais être prêté à la mauvaise partie.</p><div class="mrow"><button class="btn" onclick="closeModal()">Revenir à la transcription</button></div>`);return}
 L.run=false;L.busy=true;render();const a=aff(L.aff);log('Fin d’écoute, structuration du projet',a.rg);
 setTimeout(()=>{const d=L.kind==='dict'?mkJug():mkNotes();DB.docs.unshift(d);a.st='a_valider';S.L=null;toast('Projet prêt : '+pend(d)+' passages incertains à vérifier.','ok');go('valid',{id:d.id})},2200)}

document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();return}

function edSave(did,fid,el){const d=doc(did),f=d.fields.find(x=>x.id===fid);f.html=el.innerHTML;if(!f.edited){f.edited=true;d.corr++}d.last=Date.now()}

 if(Date.now()-d.last<3000&&!f.warn){f.warn=true;DB.quick++;log('Validation rapide signalée : rubrique « '+f.label+' »',aff(d.aff).rg);render();return}
 f.ok=true;f.warn=false;d.last=Date.now();render()}

 const f=d.fields.find(x=>x.id===u.f),t=document.createElement('div');t.innerHTML=f.html;const m=t.querySelector(`mark[data-u="${k}"]`);if(m){m.textContent=v;m.className='u ok'}f.html=t.innerHTML;

function resetDemo(){DB=mkDB();S.L=null;S.role=null;closeModal();go('start');toast('Démonstration réinitialisée','ok')}
function guide(){openModal(`<h2>${ic('play',24)}Parcours de démonstration</h2><ol style="padding-left:20px;display:flex;flex-direction:column;gap:8px">
<li><b>Greffier, Salle d’audience</b> (phase 2) : affaire 1187, appuyez sur Go (ou la barre d’espace). Observez le plan de salle et le texte. Confirmez l’intervenant quand l’assistant hésite (touches 1 à 5), coupez avec Stop, puis « Terminer et structurer ».</li>
<li><b>Relecture</b> : cliquez sur chaque passage surligné, écoutez l’extrait, choisissez la bonne lecture, validez rubrique par rubrique. Une validation trop rapide est signalée.</li>
<li><b>Validation</b> : le document devient la référence et l’audio brut est supprimé (le sceau s’appose).</li>
<li><b>Huis clos</b> : l’affaire 1203 est verrouillée. Sur une autre affaire, « Passer en huis clos » coupe et efface tout.</li>
<li><b>Magistrat, Dicter une décision</b> (phase 1, une seule voix) : dictée, projet de jugement structuré, relecture, signature.</li>
<li><b>Contrôle qualité</b> : indicateurs, audit d’un document tiré au sort, journal de chaque action.</li></ol><div class="mrow"><button class="btn" onclick="closeModal()">Commencer</button></div>`)}

/* ===== Accueil ===== */

 <footer class="pf"><div class="wrap"><p><b style="color:#fff">Assistant numérique de retranscription des audiences</b> (nom provisoire).</p><p>Maquette réalisée pour le Prix national de la simplification administrative. Elle n’est reliée à aucun système du ministère de la Justice, n’enregistre aucun son et ne contient que des données fictives.</p></div></footer>`}
let hz=0;const HZ=[['greffe','Greffier','Affaire numéro 1187 de l’année 2026…'],['siege','Président','Les parties sont-elles présentes ou représentées ?'],['barreD','Avocat de la demanderesse','Maître Agbodjan pour la demanderesse…'],['barreF','Avocat de la défenderesse','Maître Tossou pour la société défenderesse…']];
setInterval(()=>{const e=document.getElementById('heroroom');if(!e||matchMedia('(prefers-reduced-motion: reduce)').matches)return;hz=(hz+1)%HZ.length;e.querySelectorAll('.z').forEach(g=>g.classList.toggle('on',g.dataset.z===HZ[hz][0]));const c=document.getElementById('herocap');if(c)c.innerHTML=`<b>${HZ[hz][1]}</b><br><span class="muted">${HZ[hz][2]}</span>`},2400);
const VIEWS={};
VIEWS.start=()=>`<section class="hero"><div class="wrap"><div><h1 class="a1">L’audience est retranscrite. Le greffier garde la main.</h1>
 <p class="lead a2">L’assistant écoute l’audience ou la dictée du magistrat, prépare les notes d’audience ou la trame du jugement, et les soumet à la relecture. Rien ne devient officiel sans validation humaine.</p>
 <div class="row a3" style="margin-top:26px"><button class="btn lt" onclick="switchRole('greffier')">${ic('mic',18)}Entrer comme greffier</button><button class="btn ol" onclick="guide()">${ic('play',18)}Voir le parcours guidé</button></div></div>
 <div class="demo-card a4"><div class="row" style="justify-content:space-between;margin-bottom:10px"><b>Salle d’audience n° 2</b><span class="onair on"><i></i>Écoute active</span></div><div class="room" id="heroroom">${room('greffe')}</div><p id="herocap" style="margin:12px 0 0;font-family:var(--serif)"><b>Greffier</b><br><span class="muted">Affaire numéro 1187 de l’année 2026…</span></p></div></div></section>
 <section class="band"><div class="wrap"><h2>Deux phases, du plus simple au plus exigeant</h2><p class="lead">La phase 2 ne démarre que si la phase 1 a fait ses preuves.</p><div class="grid g2" style="margin-top:24px">
 <div class="card phase"><span class="num">1</span><h3>La dictée, une seule voix</h3><p class="muted">Après l’audience, le magistrat ou le greffier dicte. Une voix, un lieu calme : la retranscription est fiable. C’est le principe de BenchNotes, en service au tribunal de l’immigration britannique.</p><button class="btn sec" onclick="switchRole('magistrat');go('dict')">${ic('mic',18)}Essayer la dictée</button></div>
 <div class="card phase"><span class="num">2</span><h3>L’audience, plusieurs voix</h3><p class="muted">Micros par zone, intervenant confirmé par le greffier, repères de l’audience. Le bouton Go/Stop reste dans la main du greffier du début à la fin.</p><button class="btn sec" onclick="switchRole('greffier');go('live')">${ic('users',18)}Essayer l’audience</button></div></div></div></section>
 <section class="band alt"><div class="wrap"><h2>Trois profils</h2><div class="grid g3" style="margin-top:24px">
 ${[['greffier','edit','Greffier','Lance et coupe l’écoute, confirme les intervenants, relit et valide les notes d’audience.'],['magistrat','scale','Magistrat','Dicte sa décision, relit la trame produite, signe et transmet au greffe.'],['qualite','chart','Contrôle qualité','Suit les corrections, audite un document sur dix, consulte le journal.']].map(([r,i,t,x])=>`<div class="card space"><span class="ico">${ic(i,26)}</span><h3>${t}</h3><p class="muted" style="margin:0">${x}</p><button class="btn sec" onclick="switchRole('${r}')">Entrer comme ${t.toLowerCase()}</button></div>`).join('')}</div></div></section>
 <section class="band"><div class="wrap"><h2>Les garde-fous sont dans l’outil, pas dans une consigne</h2><div class="gcards" style="margin-top:24px">${GF.slice(0,4).map(gcard).join('')}</div><p style="margin-top:20px"><button class="btn sec" onclick="switchRole('greffier');go('garde')">Voir les huit garde-fous</button></p></div></section>`;
const GF=[['lock','Huis clos exclu par construction','Une affaire inscrite en huis clos est verrouillée : le bouton Go est inactif. Un huis clos prononcé en cours d’audience coupe l’écoute et efface tout.'],
 ['mic','Go/Stop dans la main du greffier','L’écoute ne démarre et ne s’arrête que par le bouton ou la pédale du greffier. Un voyant rouge informe la salle.'],
 ['trash','Audio supprimé après validation','L’enregistrement brut ne sert qu’à vérifier. Il est effacé à la validation, sauf l’échantillon d’audit, conservé 30 jours.'],
 ['edit','Validation rubrique par rubrique','Jamais un seul clic pour tout le document. Une validation en moins de 3 secondes est signalée.'],
 ['alert','Passages incertains bloquants','Chaque passage douteux est surligné avec son indice de confiance et doit être réécouté et confirmé.'],
 ['users','Intervenants confirmés','Quand l’assistant hésite sur qui parle, le greffier tranche d’un clic. On ne termine pas tant qu’il reste un doute.'],
 ['search','Audit par échantillonnage','Un document sur dix est comparé à l’audio par le greffier en chef. Chaque action est journalisée.'],
 ['scale','Aucune décision automatisée','L’assistant retranscrit et met en forme. Il ne propose aucune solution et n’écrit aucun motif à la place du juge.'],
 ['building','Traitement dans la juridiction','Serveur installé sur place, sans envoi vers un service extérieur, fonctionnel même sans internet.']];
const gcard=([i,t,x])=>`<div class="card gcard"><span class="ico">${ic(i,22)}</span><div><h3 style="font-size:1.08rem;margin:0">${t}</h3><p>${x}</p></div></div>`;

VIEWS.g_role=()=>{const l=DB.affs;return pageHead('Audiences du jour',`${cap(fK(TODAY))}, ${AUD.ch}, ${AUD.salle}. Président : ${AUD.pres}.`)+
 `<div class="stats"><div class="stat"><b>${l.length}</b><span>Affaires au rôle</span></div><div class="stat"><b>${l.filter(a=>a.st==='validee').length}</b><span>Notes validées</span></div><button class="stat" onclick="go('valid')"><b>${drafts().length}</b><span>Projets à valider</span></button><div class="stat"><b>${l.filter(a=>a.huis).length}</b><span>Huis clos, hors assistant</span></div></div>
 <div class="panel"><header><h2 class="grow">Rôle de l’audience</h2></header><table class="rt"><thead><tr><th>Heure</th><th>Affaire</th><th>Nature</th><th>État</th><th></th></tr></thead><tbody>${l.map(a=>{const d=DB.docs.find(x=>x.aff===a.id);return `<tr><td data-l="Heure"><b>${a.heure}</b></td><td data-l="Affaire"><span class="ref">${a.rg}</span><div class="small muted">${a.parties}</div></td><td data-l="Nature">${a.nature}</td><td data-l="État">${sbadge(a.st)}</td><td>${a.huis?`<span class="small muted">${ic('lock',14)} Verrouillée</span>`:a.st==='validee'&&d?`<button class="btn sec sm" onclick="go('doc',{id:'${d.id}'})">Voir</button>`:a.st==='a_valider'&&d?`<button class="btn sm" onclick="go('valid',{id:'${d.id}'})">Relire</button>`:`<button class="btn sm" onclick="liveInit('${a.id}','aud');go('live')">${ic('mic',16)}Ouvrir</button>`}</td></tr>`}).join('')}</tbody></table></div>
 <div class="callout">${ic('lock',22)}<div><b>Les affaires à huis clos sont exclues par construction.</b><br>L’écoute est impossible sur l’affaire TPI-COT/CIV/2026/1203. Aucun réglage ne permet de la réactiver.</div></div>`};
function liveView(kind){const list=kind==='dict'?DB.maffs.filter(a=>a.st==='a_dicter'):DB.affs.filter(a=>['attente','encours'].includes(a.st)||a.huis);
 if(!S.L||S.L.kind!==kind||!aff(S.L.aff)||(kind!=='dict'&&!list.includes(aff(S.L.aff)))){const a=list.find(x=>x.demo&&!x.huis)||list.find(x=>!x.huis);if(a)liveInit(a.id,kind)}
 const L=S.L;if(!L)return pageHead(kind==='dict'?'Dicter une décision':'Salle d’audience','')+`<div class="empty">${ic('check',22)}<span>Aucune affaire en attente. Réinitialisez la démonstration pour recommencer.</span></div>`;
 const a=aff(L.aff),locked=a.huis;
 const head=pageHead(kind==='dict'?'Dicter une décision':'Salle d’audience',kind==='dict'?'Phase 1 : une seule voix, après le délibéré. Dictez l’exposé du litige, les motifs et le dispositif ; l’assistant range le texte dans la trame du jugement.':'Phase 2 : écoute des débats avec plusieurs intervenants. Barre d’espace : Go/Stop. Touches 1 à 5 : confirmer l’intervenant.',`<span class="bd ${kind==='dict'?'sky':'orange'}">${kind==='dict'?'Phase 1':'Phase 2'}</span>`);
 const pick=`<div class="chips">${list.map(x=>`<button class="chip" aria-pressed="${x.id===L.aff}" onclick="if(S.L.run){toast('Coupez l’écoute avec Stop avant de changer d’affaire.','w');return}liveInit('${x.id}','${kind}');render()">${x.huis?ic('lock',14)+' ':''}${x.rg.split('/').slice(-2).join('/')}<small style="font-weight:500;margin-left:6px;opacity:.75">${x.nature.split(',')[0]}</small></button>`).join('')}</div>`;
 if(locked)return head+pick+`<div class="panel"><div class="lockp"><div class="ic">${ic('lock',34)}</div><h2>Écoute impossible : affaire à huis clos</h2><p class="muted" style="max-width:52ch;margin:0 auto">L’affaire ${a.rg} est inscrite en huis clos. Le bouton Go est désactivé par construction et aucun réglage ne permet de le réactiver. Le greffier prend ses notes comme aujourd’hui.</p></div></div>`;
 const nodemo=!a.demo;
 return head+pick+`<div class="livegrid"><div class="panel rel"><header><div class="grow"><h2 style="margin:0">${a.rg}</h2><span class="small muted">${a.parties}</span></div><span class="onair ${L.run?'on':''}"><i></i>${L.run?'Écoute active':'Écoute coupée'}</span></header>
 <div class="tx" id="tx" aria-live="polite">${txHTML()}</div>${L.busy?`<div class="overlay"><div><div class="spin"></div><h3>${kind==='dict'?'Construction de la trame du jugement…':'Structuration des notes d’audience…'}</h3><p class="muted">Classement par rubrique, repérage des passages incertains.</p></div></div>`:''}</div>
 <div class="ctrl"><div class="panel" style="margin:0"><div class="body" style="text-align:center"><button class="gobtn ${L.run?'on':''}" ${nodemo?'disabled':''} onclick="goStop()" aria-pressed="${L.run}">${L.run?'Stop':'Go'}<span>${L.run?'couper l’écoute':'lancer l’écoute'}</span></button>
 <div class="timer" id="timer">${fmtT(L.ms)}</div><p class="small muted" style="margin:6px 0 0">${nodemo?'Extrait de démonstration disponible pour l’affaire '+(kind==='dict'?'0874':'1187')+'.':'Durée d’écoute'}</p></div></div>
 ${kind!=='dict'?`<div class="panel" style="margin:0"><header><h3 class="grow">Micros par zone</h3><span class="small muted">zone active en rouge</span></header><div class="body room">${room(activeZone())}</div></div>
 <div class="panel" style="margin:0"><header><h3>Repères de l’audience</h3></header><div class="body"><div class="mks">${MARKS.map((m,i)=>`<button onclick="addMark(MARKS[${i}])">${ic('flag',14)} ${m}</button>`).join('')}</div></div></div>`:
 `<div class="callout">${ic('mic',22)}<div><b>Une seule voix.</b><br>En-tête et parties sont repris du dossier : dictez seulement le fond. Dites « Stop » au bouton pour réfléchir, reprenez avec Go.</div></div>`}
 <div class="grid" style="gap:10px"><button class="btn wide" onclick="finish()" ${L.busy?'disabled':''}>${ic('file',18)}Terminer et structurer</button>${kind!=='dict'?`<button class="btn sec wide" onclick="huisModal()">${ic('lock',18)}Passer en huis clos</button>`:''}</div></div></div>`}

VIEWS.valid=()=>{const id=S.params.id;
 if(!id){const l=drafts();return pageHead(S.role==='magistrat'?'Projets à relire':'À valider','Chaque projet se relit rubrique par rubrique. Les passages surlignés doivent être réécoutés et confirmés.')+
  (l.length?`<div class="panel"><table class="rt"><thead><tr><th>Affaire</th><th>Document</th><th>Passages à vérifier</th><th>Rubriques validées</th><th></th></tr></thead><tbody>${l.map(d=>{const a=aff(d.aff);return `<tr><td data-l="Affaire"><span class="ref">${a.rg}</span><div class="small muted">${a.parties}</div></td><td data-l="Document">${d.title}</td><td data-l="À vérifier">${pend(d)?`<span class="bd amber">${pend(d)}</span>`:'<span class="bd green">0</span>'}</td><td data-l="Validées">${d.fields.filter(f=>f.ok).length} / ${d.fields.length}</td><td><button class="btn sm" onclick="go('valid',{id:'${d.id}'})">Relire</button></td></tr>`}).join('')}</tbody></table></div>`:`<div class="empty">${ic('check',22)}<span>Aucun projet en attente. ${S.role==='magistrat'?'Dictez une décision pour en créer un.':'Ouvrez la salle d’audience pour en créer un.'}</span></div>`)}
 const d=doc(id),a=aff(d.aff);if(d.st!=='draft')return VIEWS.doc();if(S.lastKey.indexOf('valid|')!==0||!d.last)d.last=Date.now();
 const nOk=d.fields.filter(f=>f.ok).length,p=pend(d),all=nOk===d.fields.length&&!p;
 return crumb(S.role==='magistrat'?'Projets à relire':'À valider','valid')+pageHead(d.title,a.rg+', '+a.parties)+`<div class="split"><div>${d.fields.map(f=>fieldHTML(d,f)).join('')}</div>
 <aside class="sticky"><div class="panel"><header><h2>Relecture</h2></header><div class="body"><div class="row" style="justify-content:space-between"><b>${nOk} / ${d.fields.length} rubriques validées</b><span class="small muted">${Math.round(nOk/d.fields.length*100)} %</span></div><div class="prog"><i style="width:${nOk/d.fields.length*100}%"></i></div>
 <p class="small" style="margin:12px 0">${p?`${ic('alert',16)} <b>${p} passage${p>1?'s':''} incertain${p>1?'s':''}</b> : cliquez dessus pour écouter et confirmer.`:`${ic('check',16)} Tous les passages incertains sont vérifiés.`}</p>
 <button class="btn okb wide" ${all?'':'disabled'} onclick="docValidate('${d.id}')">${ic('shield',18)}${d.type==='jugement'?'Signer et transmettre':'Valider le document'}</button>
 <div class="secure">${ic(d.sample?'search':'mic',20)}<span>${d.sample?'Tiré au sort pour l’audit : l’audio sera conservé 30 jours après validation.':'Audio brut conservé jusqu’à la validation, puis supprimé.'}</span></div></div></div>
 <div class="callout">${ic('help',22)}<div><b>Comment relire</b><br>Lisez chaque rubrique en entier. Corrigez directement dans le texte si besoin. Les passages <mark class="u" style="cursor:default">surlignés</mark> se réécoutent d’un clic.</div></div></aside></div>`};
VIEWS.doc=()=>{const d=doc(S.params.id),a=aff(d.aff),j=d.type==='jugement',back=S.role==='greffier'?'docs':S.role==='magistrat'?'docs':'q_audit';
 return crumb(S.role==='qualite'?'Audit':j&&S.role==='magistrat'?'Décisions signées':'Documents validés',back)+pageHead(d.title,a.rg,`<button class="btn sec" onclick="toast('Export PDF simulé')">${ic('download',18)}PDF</button><button class="btn sec" onclick="toast('Export Word simulé')">${ic('download',18)}Word</button>`)+
 `<div class="seal ${S.stamp===d.id?'stamp':''}" style="max-width:800px;margin:0 auto 18px"><span class="disc">${ic('shield',26)}</span><div class="grow"><b>${j?'Décision signée':'Document validé'}</b><div class="small">${d.vby}, le ${fDT(d.vts)}</div></div><span class="bd ${d.audio==='audit'?'amber':'green'}">${ic(d.audio==='audit'?'search':'trash',14)}${d.audio==='audit'?'Audio conservé 30 jours pour audit':'Audio brut supprimé'}</span></div>
 <article class="paper"><div class="hd"><span>République du Bénin<br>Ministère de la Justice et de la Législation</span><span style="text-align:right">${AUD.jur}<br>${AUD.ch}</span></div><h2>${j?'Jugement civil':'Notes d’audience'}</h2><div class="sub">${a.rg} : ${a.parties}</div>
 ${d.fields.map(f=>`<h4>${f.label}</h4><p>${esc(plain(f.html))}</p>`).join('')}
 <div class="sig">${j?'Signé électroniquement par':'Validé par'} ${d.vby}, le ${fDT(d.vts)}. Version de référence. ${d.corr?d.corr+' correction'+(d.corr>1?'s':'')+' apportée'+(d.corr>1?'s':'')+' à la relecture.':'Aucune correction à la relecture.'}</div></article>
 ${j?`<div class="callout" style="max-width:800px;margin:0 auto">${ic('send',22)}<div><b>Transmise au greffe</b> pour la mise en forme finale et la délivrance des copies.</div></div>`:''}`};
VIEWS.docs=()=>{const l=DB.docs.filter(d=>d.st!=='draft'&&(S.role==='magistrat'?d.type==='jugement':true));
 return pageHead(S.role==='magistrat'?'Décisions signées':'Documents validés','Versions de référence, exportables en PDF ou en Word.')+`<div class="panel"><table class="rt"><thead><tr><th>Affaire</th><th>Document</th><th>Validé par</th><th>Audio</th><th></th></tr></thead><tbody>${l.map(d=>{const a=aff(d.aff);return `<tr><td data-l="Affaire"><span class="ref">${a.rg}</span><div class="small muted">${a.parties}</div></td><td data-l="Document">${d.type==='jugement'?'Décision signée, à mettre en forme':d.title}</td><td data-l="Validé par">${d.vby}<div class="small muted">${fDT(d.vts)}</div></td><td data-l="Audio">${d.audio==='audit'?'<span class="bd amber">Conservé pour audit</span>':'<span class="bd green">Supprimé</span>'}</td><td><button class="btn sec sm" onclick="go('doc',{id:'${d.id}'})">Ouvrir</button></td></tr>`}).join('')}</tbody></table></div>`};

 `<div class="stats"><div class="stat"><b>${l.filter(a=>a.st==='a_dicter').length}</b><span>Décision à dicter</span></div><button class="stat" onclick="go('valid')"><b>${drafts().length}</b><span>Projet à relire</span></button><button class="stat" onclick="go('docs')"><b>${DB.docs.filter(d=>d.type==='jugement'&&d.st==='signe').length}</b><span>Décisions signées</span></button><div class="stat"><b>0</b><span>Décision rédigée par l’assistant</span></div></div>
 <div class="panel"><header><h2>Délibérés</h2></header><table class="rt"><thead><tr><th>Affaire</th><th>Nature</th><th>État</th><th></th></tr></thead><tbody>${l.map(a=>{const d=DB.docs.find(x=>x.aff===a.id&&x.type==='jugement');return `<tr><td data-l="Affaire"><span class="ref">${a.rg}</span><div class="small muted">${a.parties}</div></td><td data-l="Nature">${a.nature}</td><td data-l="État">${sbadge(a.st)}</td><td>${a.st==='a_dicter'?`<button class="btn sm" onclick="liveInit('${a.id}','dict');go('dict')">${ic('mic',16)}Dicter</button>`:a.st==='a_valider'&&d?`<button class="btn sm" onclick="go('valid',{id:'${d.id}'})">Relire</button>`:d?`<button class="btn sec sm" onclick="go('doc',{id:'${d.id}'})">Voir</button>`:''}</td></tr>`}).join('')}</tbody></table></div>
 <div class="callout">${ic('scale',22)}<div><b>L’assistant n’écrit aucun motif à votre place.</b><br>Il range votre dictée dans la trame du jugement et reprend l’en-tête et les parties depuis le dossier.</div></div>`};

 return pageHead('Indicateurs de qualité','Depuis le début du pilote, chambre civile. Les chiffres antérieurs à la démonstration sont fictifs.')+
 `<div class="stats"><div class="stat"><b>${n}</b><span>Documents validés</span></div><div class="stat"><b>${DB.base.corr.toString().replace('.',',')}</b><span>Corrections par document en moyenne</span></div><button class="stat" onclick="go('q_audit')"><b>${DB.base.sampled+DB.audits.length-2}</b><span>Documents tirés au sort</span></button><button class="stat" onclick="go('q_journal')"><b>${DB.base.quick+DB.quick}</b><span>Validations rapides signalées</span></button></div>
 <div class="split"><div class="panel"><header><h2 class="grow">Où se trouvent les corrections</h2><span class="small muted">Nombre de corrections par rubrique, 30 derniers jours</span></header><div class="body"><div class="bars">${DB.byField.map(([l,c])=>`<div class="bar"><span>${l}</span><span class="t"><i style="width:${c/mx*100}%"></i></span><b>${c}</b></div>`).join('')}</div>
 <p class="small muted" style="margin:16px 0 0">Les débats concentrent les corrections : montants, dates et noms propres. C’est là que la relecture doit être la plus attentive.</p></div></div>
 <div><div class="panel"><header><h2>Passages incertains</h2></header><div class="body"><div class="row" style="justify-content:space-between"><span>Confirmés tels quels</span><b>71 %</b></div><div class="prog"><i style="width:71%"></i></div><div class="row" style="justify-content:space-between;margin-top:12px"><span>Corrigés par le relecteur</span><b>29 %</b></div><div class="prog"><i style="width:29%;background:var(--brass)"></i></div><p class="small muted" style="margin:12px 0 0">Un taux de confirmation proche de 100 % sur une longue période serait un signal de relecture machinale.</p></div></div>
 <div class="callout warnc">${ic('clock',22)}<div><b>${DB.base.quick+DB.quick} validations en moins de 3 secondes</b><br>Elles sont signalées au relecteur et rapportées ici, sans sanction automatique.</div></div></div></div>`};
VIEWS.q_audit=()=>pageHead('Audit par échantillonnage','Un document sur dix est tiré au sort à sa validation. Comparez le texte validé à l’enregistrement, puis classez-le.')+
 `<div class="panel"><table class="rt"><thead><tr><th>Document</th><th>Tiré au sort le</th><th>Résultat</th><th></th></tr></thead><tbody>${DB.audits.map(x=>`<tr><td data-l="Document"><span class="ref">${x.ref}</span></td><td data-l="Date">${fDs(x.date)}</td><td data-l="Résultat">${x.st==='a_auditer'?'<span class="bd amber">À auditer</span>':x.st==='conforme'?'<span class="bd green">Conforme</span>':'<span class="bd red">Écart constaté</span>'}</td><td>${x.st==='a_auditer'?`<button class="btn sm" onclick="auditOpen('${x.id}')">Comparer</button>`:`<button class="btn sec sm" onclick="auditOpen('${x.id}')">Revoir</button>`}</td></tr>`).join('')}</tbody></table></div>
 <div class="callout">${ic('trash',22)}<div>Après l’audit, ou au plus tard 30 jours après la validation, l’enregistrement du document audité est supprimé.</div></div>`;
function auditData(x){if(!x.doc)return x;const d=doc(x.doc);let raw='',v='';d.fields.filter(f=>/\{u\d+\}/.test(f.text)).forEach(f=>{raw+=`<p><b>${f.label}.</b> `+esc(f.text).replace(/\{(u\d+)\}/g,(m,k)=>{const u=d.unc[k];return u.cur!==u.orig?`<del>${esc(u.orig)}</del>`:esc(u.orig)})+'</p>';
 v+=`<p><b>${f.label}.</b> `+esc(plain(f.html)).replace(/./g,c=>c)+'</p>'});Object.values(d.unc).forEach(u=>{if(u.cur!==u.orig)v=v.replace(esc(u.cur),`<ins>${esc(u.cur)}</ins>`)});return {raw,val:v,src:Object.values(d.unc).map(u=>u.src).join(' ')}}
function auditOpen(id){const x=DB.audits.find(a=>a.id===id),dt=auditData(x);
 openModal(`<h2>${ic('search',24)}Comparer au son</h2><p class="muted">${x.ref}</p><div class="play" id="pl"><button class="btn sm" onclick="document.getElementById('pl').classList.add('on');speak(${JSON.stringify(dt.src||'Extrait non disponible.').replace(/"/g,'&quot;')})">${ic('play',16)}Écouter l’enregistrement</button><span class="pb"><i></i></span></div>
 <div class="grid g2" style="gap:12px"><div class="transcript diff"><span class="small muted">Retranscription brute de l’assistant</span><div>${dt.raw}</div></div><div class="transcript diff"><span class="small muted">Texte validé par le relecteur</span><div>${dt.val}</div></div></div>
 ${x.st==='a_auditer'?`<div class="mrow"><button class="btn sec" onclick="auditSet('${id}','ecart')">${ic('alert',18)}Écart constaté</button><button class="btn okb" onclick="auditSet('${id}','conforme')">${ic('check',18)}Conforme à l’audio</button></div>`:`<div class="mrow"><button class="btn" onclick="closeModal()">Fermer</button></div>`}`)}
function auditSet(id,st){const x=DB.audits.find(a=>a.id===id);x.st=st;log('Audit : '+(st==='conforme'?'conforme':'écart constaté'),x.ref);log('Audio de l’échantillon supprimé après audit',x.ref,'Système');if(x.doc)doc(x.doc).audio='supprime';closeModal();toast(st==='conforme'?'Document conforme. L’audio est supprimé.':'Écart enregistré. Le relecteur et le greffier en chef sont informés.','ok');render()}
VIEWS.q_journal=()=>pageHead('Journal','Chaque Go, Stop, confirmation, validation et suppression est horodaté et nominatif. Le contenu des affaires à huis clos n’y figure jamais.')+
 `<div class="panel"><table class="rt"><thead><tr><th>Date et heure</th><th>Action</th><th>Affaire</th><th>Auteur</th></tr></thead><tbody>${DB.log.slice().sort((a,b)=>b.ts.localeCompare(a.ts)).map(l=>`<tr><td data-l="Date">${fDT(l.ts)}</td><td data-l="Action">${esc(l.act)}</td><td data-l="Affaire">${l.ref}</td><td data-l="Auteur">${l.who}</td></tr>`).join('')}</tbody></table></div>`;

render();

</script>
</body>
</html>
